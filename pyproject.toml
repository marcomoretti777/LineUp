[project]
name = "lineup"
version = "1.0.0"
description = "Surf session booking for a campus surf club, with the ocean forecast in the rules"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "supabase>=2.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
